project_setup:
  seed: 42
  device: "cpu"
  num_threads: 4

data:
  chunk_size: 150
  chunk_overlap: 20

models:
  # Quan trọng: dùng embedder đa ngữ (hiểu tiếng Việt)
  dense_embedder: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  # Vẫn khai báo nhưng sẽ tắt dùng (use_reranker: false)
  reranker: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  # Dùng model QA đã test đúng (score 1.0)
  reader_qa: "letrunglinh/qa_pnc"

hyperparameters:
  hybrid_alpha: 0.6
  top_k_hybrid: 10          # tăng để dễ tìm chunk đúng
  top_k_rerank: 5
  use_reranker: false       # tắt reranker vì không hỗ trợ tiếng Việt